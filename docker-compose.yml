# cardinal-panel — запуск через Docker Compose.
#
#   cp .env.example .env   # заполнить секреты
#   docker compose up -d
#
# База данных по умолчанию — SQLite в именованном томе. Для MySQL
# раскомментируйте сервис db и выставьте DB_DIALECT=mysql.

services:
  panel:
    build:
      context: .
      args:
        VERSION: '0.1.0'
    image: cardinal-panel:0.1.0
    container_name: cardinal-panel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_DIALECT: '${DB_DIALECT:-sqlite}'
      SQLITE_PATH: /app/data/panel.sqlite
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: '3000'
    ports:
      - '${PANEL_PORT:-3000}:3000'
    volumes:
      - panel-data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Раскомментируйте, если нужен MySQL вместо SQLite.
  # db:
  #   image: mysql:8
  #   container_name: cardinal-panel-db
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD}
  #     MYSQL_DATABASE: ${DB_NAME:-ktpanel}
  #     MYSQL_USER: ${DB_USER:-kt-panel}
  #   volumes:
  #     - panel-db:/var/lib/mysql

volumes:
  panel-data:
  # panel-db:
