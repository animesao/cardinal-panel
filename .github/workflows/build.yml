name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: lint (server imports)
        run: npm run lint

      - name: проверка на секреты в отслеживаемых файлах
        run: npm run check:secrets

      - name: typecheck
        run: npm run typecheck

      - name: unit tests
        run: npm test

      - name: version sync
        run: npm run release:version -- --check

      - name: build
        run: npm run build

      - name: package release artifacts
        run: npm run release:package

      - name: simulate install (раскладка файлов после установки)
        run: npm run test:install

      - name: dependency audit (production)
        # Гейт по critical для production-зависимостей: именно они попадают
        # в релиз. Оставшиеся high — build-инструментарий (tailwind, vite,
        # esbuild, micromatch), в рантайм не попадает; полный отчёт ниже.
        run: npm audit --audit-level=critical --omit=dev

      - name: full audit report
        if: always()
        run: npm audit --omit=dev --json > audit-report.json || true

      - name: upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 14

      - name: shellcheck install.sh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning install.sh

      - name: gitleaks (secret scan)
        # Прямой вызов CLI, а не gitleaks-action: action считает диапазон
        # коммитов как <первый-новый>^..HEAD, а у первого коммита пустого
        # репозитория нет родителя — git падал с "unknown revision", и
        # action отдавал exit 1 без единой находки. CLI со --log-opts=--all
        # сканирует всю историю и не зависит от формы репозитория.
        env:
          GITLEAKS_VERSION: '8.24.3'
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks git --redact --exit-code 1 --config .gitleaks.toml --log-opts="--all" .

      - name: upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cardinal-panel-release
          path: release/
          retention-days: 7
          if-no-files-found: error
