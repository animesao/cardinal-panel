# Панель cardinal — обратный прокси перед панелью.
#
# Устанавливается установщиком в /etc/nginx/sites-available/cardinal-panel.conf
# (Debian/Ubuntu) или /etc/nginx/conf.d/cardinal-panel.conf (RHEL/Alpine).
# Плейсхолдеры __DOMAIN__ и __PORT__ подставляет install.sh.
#
# Панель слушает 127.0.0.1 — наружу торчит только прокси.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Бэкапы и файловый менеджер шлют крупные тела.
    client_max_body_size 512M;

    # Таймаут долгоживущих соединений (WebSocket, поток логов).
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket (терминал сервера).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE (логи, события) нельзя буферизовать — иначе события
        # приходят пачками с задержкой в минуту.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }
}
